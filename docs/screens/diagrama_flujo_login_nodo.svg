<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <rect width="900" height="500" rx="16" fill="#0A0E17" stroke="#1E293B" stroke-width="2"/>
  <text x="450" y="36" text-anchor="middle" fill="#00E676" font-family="monospace" font-weight="bold" font-size="16">DIAGRAMA DE ARQUITECTURA: FLUJO DE LOGIN FAIL-CLOSED Y VALIDACIÓN RBAC EN NODO</text>
  <text x="450" y="58" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="11">INACAP TI3042 // PROTOCOLO DE SEGURIDAD ESTRICTA (AES-256-GCM + ANTI-REPLAY)</text>

  <!-- Step 1: Login Box -->
  <rect x="40" y="90" width="240" height="170" rx="10" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5"/>
  <text x="55" y="115" fill="#00E5FF" font-family="monospace" font-weight="bold" font-size="12">1. AUTENTICACIÓN APP</text>
  <text x="55" y="138" fill="#F8FAFC" font-family="monospace" font-size="10">• Usuario ingresa Email + Clave</text>
  <text x="55" y="156" fill="#F8FAFC" font-family="monospace" font-size="10">• Consulta a Firebase Auth</text>
  <rect x="55" y="172" width="210" height="40" rx="6" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1"/>
  <text x="65" y="188" fill="#EF4444" font-family="monospace" font-weight="bold" font-size="9">POLÍTICA FAIL-CLOSED:</text>
  <text x="65" y="202" fill="#FCA5A5" font-family="monospace" font-size="8">Sin red o error -&gt; ACCESO DENEGADO</text>
  <text x="55" y="235" fill="#94A3B8" font-family="monospace" font-size="9">• Consulta Rol a Firestore (/usuarios)</text>
  <text x="55" y="250" fill="#00E676" font-family="monospace" font-size="9">• Rol por defecto: OBSERVADOR</text>

  <!-- Arrow 1 to 2 -->
  <line x1="280" y1="175" x2="330" y2="175" stroke="#00E676" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Cripto Derivation & Payload -->
  <rect x="330" y="90" width="240" height="170" rx="10" fill="#0F172A" stroke="#00E676" stroke-width="1.5"/>
  <text x="345" y="115" fill="#00E676" font-family="monospace" font-weight="bold" font-size="12">2. DERIVACIÓN &amp; CIFRADO</text>
  <text x="345" y="138" fill="#F8FAFC" font-family="monospace" font-size="10">• PIN 6 dígitos obligatorio</text>
  <text x="345" y="156" fill="#F8FAFC" font-family="monospace" font-size="10">• PBKDF2 (HMAC-SHA256, 10k iter)</text>
  <text x="345" y="174" fill="#00E5FF" font-family="monospace" font-size="10">• Deriva Clave AES-256 (32 bytes)</text>
  <rect x="345" y="188" width="210" height="60" rx="6" fill="#030712" stroke="#334155" stroke-width="1"/>
  <text x="355" y="206" fill="#00E676" font-family="monospace" font-size="8">TRAMA SEGURA (ANTI-REPLAY):</text>
  <text x="355" y="222" fill="#94A3B8" font-family="monospace" font-size="8">"OPEN;OPERADOR;&lt;time&gt;;&lt;nonce&gt;"</text>
  <text x="355" y="238" fill="#00E5FF" font-family="monospace" font-size="8">Cifrado con AES-GCM (IV + Tag 128b)</text>

  <!-- Arrow 2 to 3 -->
  <line x1="570" y1="175" x2="620" y2="175" stroke="#00E676" stroke-width="2"/>

  <!-- Step 3: Enlace de Transporte -->
  <rect x="620" y="90" width="240" height="170" rx="10" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5"/>
  <text x="635" y="115" fill="#00E5FF" font-family="monospace" font-weight="bold" font-size="12">3. CANAL DE TRANSPORTE</text>
  <text x="635" y="138" fill="#F8FAFC" font-family="monospace" font-size="10">• Wi-Fi TCP Puerto 5050</text>
  <text x="635" y="156" fill="#F8FAFC" font-family="monospace" font-size="10">• Bluetooth RFCOMM (SPP)</text>
  <text x="635" y="174" fill="#F8FAFC" font-family="monospace" font-size="10">• ESP-NOW 2.4 GHz (Peer-to-Peer)</text>
  <rect x="635" y="190" width="210" height="58" rx="6" fill="#030712" stroke="#EF4444" stroke-width="1"/>
  <text x="645" y="208" fill="#EF4444" font-family="monospace" font-size="8">GUARDARRAÍL DE TRANSPORTE:</text>
  <text x="645" y="224" fill="#94A3B8" font-family="monospace" font-size="8">Rechazo de texto plano en control.</text>
  <text x="645" y="238" fill="#94A3B8" font-family="monospace" font-size="8">Payload viaja en Base64 autenticado.</text>

  <!-- Lower Section: Validation at Node -->
  <rect x="40" y="290" width="820" height="180" rx="12" fill="#0F172A" stroke="#00E676" stroke-width="2"/>
  <text x="60" y="320" fill="#00E676" font-family="monospace" font-weight="bold" font-size="14">4. VALIDACIÓN CRIPTOGRÁFICA Y CONTROL DE ACCESO BASADO EN ROLES EN EL NODO (ESP32 / APP RECEPTORA)</text>

  <g transform="translate(60, 340)">
    <!-- Sub-check 1 -->
    <rect x="0" y="0" width="180" height="110" rx="6" fill="#030712" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="22" fill="#00E5FF" font-family="monospace" font-weight="bold" font-size="10">Paso 4.1: Descifrado</text>
    <text x="12" y="42" fill="#94A3B8" font-family="monospace" font-size="9">• Verificación Tag 128b</text>
    <text x="12" y="60" fill="#94A3B8" font-family="monospace" font-size="9">• Detección de alteración</text>
    <text x="12" y="78" fill="#EF4444" font-family="monospace" font-size="9">Tag inválido -&gt; DESCARTAR</text>
    <text x="12" y="96" fill="#00E676" font-family="monospace" font-size="9">Tag correcto -&gt; Texto plano</text>

    <!-- Sub-check 2 -->
    <rect x="195" y="0" width="190" height="110" rx="6" fill="#030712" stroke="#1E293B" stroke-width="1"/>
    <text x="207" y="22" fill="#00E5FF" font-family="monospace" font-weight="bold" font-size="10">Paso 4.2: Filtro Replay</text>
    <text x="207" y="42" fill="#94A3B8" font-family="monospace" font-size="9">• Delta Timestamp: &lt; 30s</text>
    <text x="207" y="60" fill="#94A3B8" font-family="monospace" font-size="9">• Nonce en Cache Circular</text>
    <text x="207" y="78" fill="#EF4444" font-family="monospace" font-size="9">Nonce repetido -&gt; ALERTA</text>
    <text x="207" y="96" fill="#00E676" font-family="monospace" font-size="9">Nonce nuevo -&gt; Consumido</text>

    <!-- Sub-check 3 -->
    <rect x="400" y="0" width="185" height="110" rx="6" fill="#030712" stroke="#1E293B" stroke-width="1"/>
    <text x="412" y="22" fill="#00E5FF" font-family="monospace" font-weight="bold" font-size="10">Paso 4.3: Validación RBAC</text>
    <text x="412" y="42" fill="#94A3B8" font-family="monospace" font-size="9">• Extracción campo Rol</text>
    <text x="412" y="60" fill="#EF4444" font-family="monospace" font-size="9">Rol OBSERVADOR -&gt; RECHAZO</text>
    <text x="412" y="78" fill="#00E676" font-family="monospace" font-size="9">Rol OPERADOR -&gt; AUTORIZADO</text>
    <text x="412" y="96" fill="#00E676" font-family="monospace" font-size="9">Rol ADMIN -&gt; AUTORIZADO</text>

    <!-- Sub-check 4 -->
    <rect x="600" y="0" width="180" height="110" rx="6" fill="#030712" stroke="#00E676" stroke-width="1"/>
    <text x="612" y="22" fill="#00E676" font-family="monospace" font-weight="bold" font-size="10">Paso 4.4: Actuación</text>
    <text x="612" y="42" fill="#F8FAFC" font-family="monospace" font-size="9">• Servomotor SG90 a 90°</text>
    <text x="612" y="60" fill="#F8FAFC" font-family="monospace" font-size="9">• LED Verde ON / Rojo OFF</text>
    <text x="612" y="78" fill="#00E5FF" font-family="monospace" font-size="9">• Auto-cierre en 3.5s</text>
    <text x="612" y="96" fill="#00E676" font-family="monospace" font-size="9">• ACK + Log a Firestore</text>
  </g>
</svg>
