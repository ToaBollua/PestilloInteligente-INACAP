<svg width="860" height="420" viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#020503"/>
            <stop offset="100%" stop-color="#060c07"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="860" height="420" fill="url(#grad-bg)" stroke="#164024" stroke-width="2" rx="8"/>

    <!-- GRID PATTERN SUBTLE -->
    <g stroke="#00ff41" stroke-width="0.3" stroke-opacity="0.1">
        <line x1="0" y1="40" x2="860" y2="40"/>
        <line x1="0" y1="80" x2="860" y2="80"/>
        <line x1="0" y1="120" x2="860" y2="120"/>
        <line x1="0" y1="160" x2="860" y2="160"/>
        <line x1="0" y1="200" x2="860" y2="200"/>
        <line x1="0" y1="240" x2="860" y2="240"/>
        <line x1="0" y1="280" x2="860" y2="280"/>
        <line x1="0" y1="320" x2="860" y2="320"/>
        <line x1="0" y1="360" x2="860" y2="360"/>
        <line x1="0" y1="400" x2="860" y2="400"/>
    </g>

    <!-- HEADER TITLE -->
    <text x="430" y="24" fill="#00ff41" font-family="Fira Code, monospace, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">/// DIAGRAMA DE FLUJO Y MÁQUINA DE ESTADOS // PESTILLO IoT DISTRIBUIDO (ES1)</text>

    <!-- ================= NODO 1: SENSOR EXTERIOR ================= -->
    <rect x="25" y="40" width="375" height="360" fill="#030804" fill-opacity="0.85" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="5 3" rx="6"/>
    <rect x="35" y="48" width="220" height="20" fill="#00e5ff" fill-opacity="0.15" rx="3"/>
    <text x="45" y="62" fill="#00e5ff" font-family="Fira Code, monospace, sans-serif" font-size="10" font-weight="bold">NODO 1: ESP32 SENSOR (EXTERIOR)</text>

    <!-- Box 1: Sensor Loop -->
    <rect x="55" y="80" width="315" height="34" fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff" stroke-width="1.2" rx="4"/>
    <text x="212" y="97" fill="#d5f2dc" font-family="Fira Code, monospace, sans-serif" font-size="9.5" text-anchor="middle">Muestreo HC-SR04 (Trig 10µs / Echo 30ms)</text>
    <text x="212" y="108" fill="#548262" font-family="Fira Code, monospace, sans-serif" font-size="8" text-anchor="middle">Intervalo no bloqueante: cada 100 ms</text>

    <!-- Diamond 1: Distance Check -->
    <polygon points="212,130 320,158 212,186 104,158" fill="#d000ff" fill-opacity="0.12" stroke="#d000ff" stroke-width="1.5"/>
    <text x="212" y="156" fill="#f0abfc" font-family="Fira Code, monospace, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">¿Distancia &lt; 8 cm?</text>
    <text x="212" y="167" fill="#d000ff" font-family="Fira Code, monospace, sans-serif" font-size="7.5" text-anchor="middle">(Egreso Físico Local)</text>

    <!-- Diamond 2: Remote App Check -->
    <polygon points="212,210 320,238 212,266 104,238" fill="#d000ff" fill-opacity="0.12" stroke="#d000ff" stroke-width="1.5"/>
    <text x="212" y="236" fill="#f0abfc" font-family="Fira Code, monospace, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">¿Comando App Móvil?</text>
    <text x="212" y="247" fill="#d000ff" font-family="Fira Code, monospace, sans-serif" font-size="7.5" text-anchor="middle">(Apertura Remota U2-U4)</text>

    <!-- Box 2: Dispatch ESP-NOW -->
    <rect x="55" y="295" width="315" height="42" fill="#00ff41" fill-opacity="0.1" stroke="#00ff41" stroke-width="1.4" rx="4"/>
    <text x="212" y="312" fill="#00ff41" font-family="Fira Code, monospace, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Empaquetar struct_message { unlock = true }</text>
    <text x="212" y="326" fill="#a8f0b8" font-family="Fira Code, monospace, sans-serif" font-size="8.5" text-anchor="middle">Despachar via esp_now_send() [2.4 GHz]</text>

    <!-- Box 3: Cooldown -->
    <rect x="110" y="355" width="205" height="26" fill="#070d08" stroke="#548262" stroke-width="1" rx="3"/>
    <text x="212" y="372" fill="#548262" font-family="Fira Code, monospace, sans-serif" font-size="8.5" text-anchor="middle">Cooldown 3500ms (Anti-Flooding)</text>

    <!-- Connectors Node 1 -->
    <line x1="212" y1="114" x2="212" y2="130" stroke="#00e5ff" stroke-width="1.5"/>
    
    <!-- Distance YES -> Local touchless bypass (Direct to dispatch) -->
    <path d="M 320 158 L 350 158 L 350 280 L 290 280 L 290 295" fill="none" stroke="#00ff41" stroke-width="1.5"/>
    <text x="353" y="210" fill="#00ff41" font-family="Fira Code, monospace, sans-serif" font-size="8" font-weight="bold">SÍ (Sin Auth)</text>

    <!-- Distance NO -> Check Remote App -->
    <line x1="212" y1="186" x2="212" y2="210" stroke="#d000ff" stroke-width="1.5"/>
    <text x="218" y="200" fill="#d000ff" font-family="Fira Code, monospace, sans-serif" font-size="7.5">NO</text>

    <!-- Remote App YES -> Dispatch -->
    <line x1="212" y1="266" x2="212" y2="295" stroke="#00ff41" stroke-width="1.5"/>
    <text x="218" y="282" fill="#00ff41" font-family="Fira Code, monospace, sans-serif" font-size="8" font-weight="bold">SÍ</text>

    <!-- Remote App NO -> Return to Loop -->
    <path d="M 104 238 L 70 238 L 70 97 L 55 97" fill="none" stroke="#548262" stroke-width="1" stroke-dasharray="3"/>
    <text x="75" y="170" fill="#548262" font-family="Fira Code, monospace, sans-serif" font-size="7.5">NO</text>

    <!-- Dispatch to Cooldown and Return -->
    <line x1="212" y1="337" x2="212" y2="355" stroke="#00ff41" stroke-width="1.2"/>
    <path d="M 110 368 L 45 368 L 45 97 L 55 97" fill="none" stroke="#548262" stroke-width="1" stroke-dasharray="3"/>

    <!-- ================= WIRELESS ESP-NOW CHANNEL ================= -->
    <path d="M 370 316 Q 430 220 460 97" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#glow-cyan)"/>
    <rect x="385" y="195" width="90" height="30" fill="#030804" stroke="#00e5ff" stroke-width="1" rx="4"/>
    <text x="430" y="209" fill="#00e5ff" font-family="Fira Code, monospace, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">ESP-NOW</text>
    <text x="430" y="219" fill="#a8f0b8" font-family="Fira Code, monospace, sans-serif" font-size="7" text-anchor="middle">&lt; 5 ms Latencia</text>

    <!-- ================= NODO 2: ACTUADOR INTERIOR ================= -->
    <rect x="460" y="40" width="375" height="360" fill="#030804" fill-opacity="0.85" stroke="#00ff41" stroke-width="1.5" stroke-dasharray="5 3" rx="6"/>
    <rect x="470" y="48" width="240" height="20" fill="#00ff41" fill-opacity="0.15" rx="3"/>
    <text x="480" y="62" fill="#00ff41" font-family="Fira Code, monospace, sans-serif" font-size="10" font-weight="bold">NODO 2: ESP32 ACTUADOR (INTERIOR)</text>

    <!-- Box A: OnDataRecv Interruption -->
    <rect x="490" y="80" width="315" height="34" fill="#00ff41" fill-opacity="0.08" stroke="#00ff41" stroke-width="1.2" rx="4"/>
    <text x="647" y="96" fill="#00ff41" font-family="Fira Code, monospace, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Interrupción OnDataRecv(incomingData)</text>
    <text x="647" y="108" fill="#d5f2dc" font-family="Fira Code, monospace, sans-serif" font-size="8" text-anchor="middle">Recepción asíncrona de trama struct_message</text>

    <!-- Diamond A: Check unlock command -->
    <polygon points="647,132 755,160 647,188 539,160" fill="#d000ff" fill-opacity="0.12" stroke="#d000ff" stroke-width="1.5"/>
    <text x="647" y="157" fill="#f0abfc" font-family="Fira Code, monospace, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">¿unlock == true?</text>
    <text x="647" y="168" fill="#d000ff" font-family="Fira Code, monospace, sans-serif" font-size="7.5" text-anchor="middle">(Orden Válida)</text>

    <!-- Box B: Unlock Action -->
    <rect x="490" y="208" width="150" height="56" fill="#00ff41" fill-opacity="0.12" stroke="#00ff41" stroke-width="1.4" rx="4"/>
    <text x="565" y="224" fill="#00ff41" font-family="Fira Code, monospace, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">1. LED Verde ON (22)</text>
    <text x="565" y="238" fill="#00ff41" font-family="Fira Code, monospace, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">2. LED Rojo OFF (23)</text>
    <text x="565" y="252" fill="#a8f0b8" font-family="Fira Code, monospace, sans-serif" font-size="8.5" text-anchor="middle">Servo 90° (Retraer)</text>

    <!-- Box C: Timer 3000ms -->
    <rect x="490" y="280" width="150" height="30" fill="#070d08" stroke="#00e5ff" stroke-width="1.2" rx="3"/>
    <text x="565" y="295" fill="#00e5ff" font-family="Fira Code, monospace, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">delay(3000 ms)</text>
    <text x="565" y="305" fill="#a8f0b8" font-family="Fira Code, monospace, sans-serif" font-size="7.5" text-anchor="middle">Ventana de paso abierta</text>

    <!-- Box D: Relock Action -->
    <rect x="490" y="325" width="150" height="56" fill="#ff003c" fill-opacity="0.1" stroke="#ff003c" stroke-width="1.4" rx="4"/>
    <text x="565" y="341" fill="#ff003c" font-family="Fira Code, monospace, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">1. Servo 0° (Extender)</text>
    <text x="565" y="355" fill="#ff003c" font-family="Fira Code, monospace, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">2. LED Verde OFF (22)</text>
    <text x="565" y="369" fill="#ff6b81" font-family="Fira Code, monospace, sans-serif" font-size="8.5" text-anchor="middle">LED Rojo ON (Bloqueado)</text>

    <!-- Box E: Discard / Locked state -->
    <rect x="670" y="240" width="145" height="42" fill="#070d08" stroke="#548262" stroke-width="1" rx="4"/>
    <text x="742" y="258" fill="#548262" font-family="Fira Code, monospace, sans-serif" font-size="8.5" text-anchor="middle">Descartar paquete</text>
    <text x="742" y="271" fill="#ff003c" font-family="Fira Code, monospace, sans-serif" font-size="8" text-anchor="middle">Mantener Bloqueo (0°)</text>

    <!-- Connectors Node 2 -->
    <line x1="647" y1="114" x2="647" y2="132" stroke="#00ff41" stroke-width="1.5"/>

    <!-- unlock == true (YES) -->
    <path d="M 593 160 L 565 160 L 565 208" fill="none" stroke="#00ff41" stroke-width="1.5"/>
    <text x="575" y="185" fill="#00ff41" font-family="Fira Code, monospace, sans-serif" font-size="8" font-weight="bold">SÍ</text>

    <!-- unlock == false (NO) -->
    <path d="M 701 160 L 742 160 L 742 240" fill="none" stroke="#ff003c" stroke-width="1.5"/>
    <text x="715" y="185" fill="#ff003c" font-family="Fira Code, monospace, sans-serif" font-size="8">NO</text>

    <!-- Step connections -->
    <line x1="565" y1="264" x2="565" y2="280" stroke="#00ff41" stroke-width="1.5"/>
    <line x1="565" y1="310" x2="565" y2="325" stroke="#00e5ff" stroke-width="1.5"/>

    <!-- Loop back to idle -->
    <path d="M 490 353 L 475 353 L 475 97 L 490 97" fill="none" stroke="#548262" stroke-width="1" stroke-dasharray="3"/>
    <path d="M 742 282 L 742 370 L 640 370" fill="none" stroke="#548262" stroke-width="1" stroke-dasharray="3"/>

</svg>
